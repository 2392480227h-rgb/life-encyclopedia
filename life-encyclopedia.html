    // ── Web Search (local cache) ──
    function webSearch(query) {
      webResultsSection.classList.add('show');
      searchLoading.classList.add('show');
      webResultsGrid.innerHTML = '';

      // Simulate brief loading for UX
      setTimeout(() => {
        searchLoading.classList.remove('show');
        const results = [];
        const seen = new Set();

        // Match query against cache keys
        for (const [key, items] of Object.entries(searchCache)) {
          if (query.includes(key) || key.includes(query) || 
              items.some(item => item.title.includes(query) || item.body.includes(query))) {
            for (const item of items) {
              if (!seen.has(item.href)) {
                results.push(item);
                seen.add(item.href);
              }
            }
          }
        }

        // If no exact match, fuzzy match by character overlap
        if (results.length === 0) {
          for (const [key, items] of Object.entries(searchCache)) {
            const overlap = [...key].filter(c => query.includes(c)).length;
            if (overlap >= 1) {
              for (const item of items) {
                if (!seen.has(item.href)) {
                  results.push(item);
                  seen.add(item.href);
                }
              }
            }
          }
        }

        if (results.length > 0) {
          webResultsGrid.innerHTML = results.slice(0, 8).map(r => {
            let domain = '';
            try { domain = new URL(r.href).hostname.replace('www.', ''); } catch(e) {}
            return `<a href="${escapeHtml(r.href)}" target="_blank" rel="noopener" class="web-result-card">
              <h4>${escapeHtml(r.title)}</h4>
              <p>${escapeHtml(r.body)}</p>
              <span class="src-domain">${escapeHtml(domain)}</span>
            </a>`;
          }).join('');
        } else {
          webResultsGrid.innerHTML = '<div class="no-results show"><div class="icon">🌐</div><p>未找到相关网络结果，试试其他关键词～</p></div>';
        }
      }, 300);
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    searchInput.addEventListener('input', applyFilters);
    searchBtn.addEventListener('click', applyFilters);
    searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') applyFilters();
    });

    // ── Detail Panel ──
    catGrid.addEventListener('click', (e) => {
      const card = e.target.closest('.cat-card');
      if (!card) return;
      const cat = card.dataset.cat;
      if (!cat || !tipData[cat]) return;
      openDetail(cat);
    });

    function openDetail(cat) {
      const data = tipData[cat];
      let tipsHTML = data.tips.map(t => `
        <div class="tip-item">
          <span class="tip-tag">${t.tag}</span>
          <h4>${t.title}</h4>
          <p>${t.text}</p>
        </div>
      `).join('');

      detailPanel.innerHTML = `
        <button class="close-btn" id="closeDetail">&times;</button>
        <img class="detail-img" src="${data.img}" alt="${data.title}" loading="lazy">
        <h2>${data.title}</h2>
        <p class="detail-subtitle">${data.subtitle} · ${data.tips.length} 个实用妙招</p>
        ${tipsHTML}
      `;

      detailOverlay.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    detailOverlay.addEventListener('click', (e) => {
      if (e.target === detailOverlay || e.target.id === 'closeDetail') {
        closeDetail();
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeDetail();
    });

    function closeDetail() {
      detailOverlay.classList.remove('open');
      document.body.style.overflow = '';
    }
  </script>
